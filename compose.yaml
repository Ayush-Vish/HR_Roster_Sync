services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: roster
      POSTGRES_USER: roster
      POSTGRES_PASSWORD: ${DB_PASSWORD:-roster-local}
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["roster-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U roster -d roster"]
      interval: 3s
      timeout: 3s
      retries: 20
  app:
    build: .
    ports: ["127.0.0.1:8080:8080"]
    environment:
      DB_URL: jdbc:postgresql://db:5432/roster
      DB_PASSWORD: ${DB_PASSWORD:-roster-local}
      APP_PASSWORD: ${APP_PASSWORD:-local-demo-password}
      WORKER_ENABLED: ${WORKER_ENABLED:-true}
      MISSING_THRESHOLD: ${MISSING_THRESHOLD:-0.30}
      ORDERING_MODE: ${ORDERING_MODE:-VERSION_PREFERRED}
    depends_on:
      db: {condition: service_healthy}
volumes:
  roster-data:
